server:
  port: 8082
  shutdown: graceful



spring:
  application:
    name: transaction-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    error:
      include-binding-errors: never
      include-message: never
      include-stacktrace: never
    

  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5433/transaction_db}
    username: ${TRANSACTION_DB_USER:transaction_user}
    password: ${TRANSACTION_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

# Custom properties: bind these to a @ConfigurationProperties record,
# and use them in your issuer and audience validators.
payshield:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
  transactions:
    max-amount: 1000000
    max-page-size: 100
    max-future-skew: 5m
    max-age: 365d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.payshield: INFO
  # The MDC key must match the one your correlation filter sets
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"