server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${IDENTITY_DB_USER:identity_user}
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

payshield:
  jwt:
    private-key-path: "D:/Playshield/keys/private.pem"
    public-key-path: "D:/Playshield/keys/public.pem"
    issuer: "http://payshield-identity-service"
    audience: "payshield-api"
    access-token-ttl-minutes: 15